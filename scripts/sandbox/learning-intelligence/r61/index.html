<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="myway-token" content="__TOKEN__"><title>MyWay R6.1</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>MyWay <small>R6.1 foundation</small></h1><span class="tag">OFFLINE FIXTURE · NO API CALLS</span></header><section class="session"><label>Session <input id="session" value="r61fixture01" maxlength="40"></label><button id="load">Load</button><input id="question" placeholder="Enter a test learner message" maxlength="4000"><button id="send">Run fixture turn</button></section><p id="status" role="status">Scripted fixture outputs test the pipeline; not autonomous teaching.</p><section id="comparison" hidden><label>Inspect variant <select id="variant"><option value="b_only">B-only · one call</option><option value="bx">B+X · two calls</option></select></label><button id="choose">Choose inspected variant</button><span id="choice"></span></section><section id="player" hidden><div id="stage"><iframe id="scene" sandbox="allow-scripts" title="Generated educational scene"></iframe><div id="textScene" hidden></div><div id="caption" hidden></div><svg id="markLayer" viewBox="0 0 1000 600" preserveAspectRatio="none" hidden aria-label="Draw feedback region"><path id="markPath" fill="none" stroke="#ffd49a" stroke-width="4" vector-effect="non-scaling-stroke"/></svg><div id="feedback" hidden><strong>Selected moment</strong><select id="reason"><option>Confusing</option><option>Visual unclear</option><option>Too fast</option><option>Boring</option><option>Helpful</option><option>Technical issue</option></select><input id="note" placeholder="Optional comment" maxlength="1000"><button id="saveMark">Save feedback</button><button id="cancelMark">Cancel</button></div></div><div class="bar"><div id="timeline"><input id="seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="Playback position"><div id="timeMark" hidden></div><div
